
<usa-card-group>

  <!-- Small Organization -->
  <usa-card class="flex-1">
    <usa-card-header>
      <div class="header-title-flex">
        
        <div class="header-title-flex">
          <img class="irf-pr-15 img-size" src="/x_g_dhs_cisa_vm_re.small-org.svg"/>
        </div>

        <div class="title title-blue irf-pt-15">Small Organizations</div>

      </div>
      
    </usa-card-header>

    <usa-card-body>
      0 to 9 IT personnel; encompasses more than 90% of organizations
    </usa-card-body>

    <usa-card-footer>
      <usa-button variant="primary" class="btn btn-primary" ng-click="c.navigate('small')" aria-label="Take the survey for small sized organizations">Start Here</usa-button>
    </usa-card-footer>

  </usa-card>

  <!-- Medium Organization -->
  <usa-card class="flex-1">
    <usa-card-header>

      <div class="header-title-flex">
        <div class="header-title-flex">
          <img class="irf-pr-15 img-size" src="/x_g_dhs_cisa_vm_re.medium-org.svg"/>
        </div>

        <div class="title title-blue irf-pt-15">Medium Organizations</div>
      </div>


    </usa-card-header>

    <usa-card-body>
      10 to 99 IT personnel; encompasses 5-9% of organizations
    </usa-card-body>

    <usa-card-footer>
      <usa-button variant="primary" class="btn btn-primary" ng-click="c.navigate('medium')" aria-label="Take the survey for medium sized organizations">Start Here</usa-button>
    </usa-card-footer>

  </usa-card>

  <!-- Large Organization -->
  <usa-card class="flex-1">
    <usa-card-header>

      <div class="header-title-flex">
        <div class="header-title-flex">
          <img class="irf-pr-15 img-size" src="/x_g_dhs_cisa_vm_re.large-org.svg"/>
        </div>

        <div class="title title-blue irf-pt-15">Large Organizations</div>
      </div>

    </usa-card-header>

    <usa-card-body>
      100+ IT personnel; the top 1% of organizations
    </usa-card-body>

    <usa-card-footer>
      <usa-button variant="primary" class="btn btn-primary" ng-click="c.navigate('large')" aria-label="Take the survey for large sized organizations">Start Here</usa-button>
    </usa-card-footer>

  </usa-card>

</usa-card-group>

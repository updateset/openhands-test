<div ng-style="c.dynamicHeight"
    ng-class="{'row card card-white': options.variant == 'white', 'row card card-blue': options.variant == 'blue'}">

    <div class="col-sm-12 col-xs-12">
        <!-- ng-class="{'row title title-white': options.variant == 'white', 'row title title-blue': options.variant == 'blue'}" -->
        <div class="row">
            <div ng-if="options.position == 'left' && c.getShowLogo() && options.logo.length > 0"
                class="col-sm-2 col-xs-12 logo">
                <img class="pull-left" src={{options.logo}} width={{options.width}} height={{options.height}} alt={{options.alt_text}} />
            </div>

            <div ng-class="{'title title-white': options.variant == 'white', 'title title-blue': options.variant == 'blue'}"
                class="col-sm-10 col-xs-12" ng-bind-html="c.trustedTitle"></div>

            <div ng-if="options.position == 'right' && c.getShowLogo() && options.logo.length > 0"
                class="col-sm-2 col-xs-12 logo">
                <img class="pull-right" src={{options.logo}} width={{options.width}} height={{options.height}} alt={{options.alt_text}} />
            </div>
        </div>

        <div ng-style="c.dynamicContentHeight" class="row content">
            <div class="col-xs-12" ng-bind-html="c.trustedContent">
            </div>
        </div>
        <div ng-if="options.button.length > 0 && options.link.length > 0" class="row button">
            <button class="btn btn-primary" ng-click="c.navigate()" aria-label="{{c.options.button_aria_label}}">
              {{options.button}}
            </button>
        </div>
    </div>

</div>
